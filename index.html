      try {
        var t = JSON.parse(localStorage.getItem('lordlook-theme') || '{}');
        if (t.state && t.state.isDark === false) {
          // user explicitly chose light — keep light
        } else {
          document.documentElement.classList.add('dark');
        }

        document.documentElement.classList.add('dark');
