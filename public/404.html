<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    const redirectUrl =
      "/?/" +
      path.slice(1).replace(/&/g, "~and~") +
      (search ? "&" + search.slice(1).replace(/&/g, "~and~") : "") +
      hash;

    window.location.replace(redirectUrl);
  </script>
</head>
<body>
</body>
</html>
